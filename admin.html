<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayakani Bakery - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #238b45;
            margin: 0;
            font-size: 28px;
        }

        .logo p {
            color: #666;
            margin-top: 8px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #238b45;
            box-shadow: 0 0 0 2px rgba(35, 139, 69, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #238b45;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #176b32;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            min-height: 22px;
            font-size: 14px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #238b45;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <h1>Kayakani Bakery & Sweets</h1>
            <p>Admin Panel</p>
        </div>

        <h2>Admin Login</h2>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Admin Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="username"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="back-link">
            <a href="index.html">← Back to Bakery</a>
        </div>

    </div>


    <!-- Firebase Login -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        // Firebase configuration

        const firebaseConfig = {
            apiKey: "AIzaSyCuy68o-h0dcAVO7cg183xlQnBpttp2gAs",
            authDomain: "kayakani-bakery.firebaseapp.com",
            projectId: "kayakani-bakery",
            storageBucket: "kayakani-bakery.firebasestorage.app",
            messagingSenderId: "861879891216",
            appId: "1:861879891216:web:a9c91ee27859ef9ef62195"
        };


        // Initialize Firebase

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        // Login

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                const loginButton =
                    document.getElementById("loginButton");


                // Check fields

                if (email === "" || password === "") {

                    message.style.color = "red";
                    message.innerText =
                        "Please enter email and password.";

                    return;
                }


                // Loading

                loginButton.disabled = true;
                loginButton.innerText = "Logging in...";

                message.style.color = "#555";
                message.innerText = "Please wait...";


                try {

                    // Keep user logged in

                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );


                    // Firebase login

                    const credential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user = credential.user;


                    console.log(
                        "✅ Login successful"
                    );

                    console.log(
                        "Admin UID:",
                        user.uid
                    );

                    console.log(
                        "Admin Email:",
                        user.email
                    );


                    // Verify current user

                    if (!auth.currentUser) {

                        throw new Error(
                            "Firebase login succeeded, but the login session was not saved."
                        );
                    }


                    message.style.color = "green";

                    message.innerText =
                        "✅ Login successful! Opening dashboard...";


                    // Small delay so Firebase session is saved

                    setTimeout(function() {

                        window.location.href =
                            "./admin-dashboard.html";

                    }, 500);


                } catch (error) {

                    console.error(
                        "❌ Login error:",
                        error
                    );


                    loginButton.disabled = false;
                    loginButton.innerText = "Login";


                    message.style.color = "red";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        message.innerText =
                            "❌ Invalid email or password.";

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message.innerText =
                            "❌ Admin account not found.";

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        message.innerText =
                            "❌ Incorrect password.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        message.innerText =
                            "❌ Invalid email address.";

                    }

                    else if (
                        error.code ===
                        "auth/network-request-failed"
                    ) {

                        message.innerText =
                            "❌ Network error. Check your internet connection.";

                    }

                    else {

                        message.innerText =
                            "❌ Login failed: " +
                            error.message;

                    }

                }

            });

    </script>

</body>
</html>
