<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayakani Bakery - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf0;
            color: #173b20;
        }

        header {
            background: #173b20;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            background: white;
            color: #173b20;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
            text-align: center;
        }

        .stat h3 {
            margin: 0;
            font-size: 32px;
            color: #638d32;
        }

        .stat p {
            margin-bottom: 0;
            color: #777;
        }

        .orders {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .order h3 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 12px;
            border-radius: 15px;
            background: #e7efd9;
            color: #173b20;
            font-weight: bold;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 30px;
        }

        @media(max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <h2>🍰 Kayakani Admin</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h1>Admin Dashboard</h1>

        <p>Manage your bakery orders from here.</p>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <h3 id="orderCount">0</h3>

            <p>Total Orders</p>

        </div>


        <div class="stat">

            <h3 id="todayOrders">0</h3>

            <p>Today's Orders</p>

        </div>


        <div class="stat">

            <h3 id="sales">₹0</h3>

            <p>Total Sales</p>

        </div>

    </div>


    <!-- ORDERS -->

    <div class="orders">

        <h2>📦 Customer Orders</h2>


        <!-- SEARCH -->

        <input
            type="text"
            id="searchOrders"
            placeholder="🔍 Search by name, phone or order ID..."
            style="width:100%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:10px; font-size:16px;"
        >


        <!-- STATUS FILTER -->

        <select
            id="statusFilter"
            style="width:100%; padding:12px; margin:5px 0 15px 0; border:1px solid #ddd; border-radius:10px; font-size:16px;"
        >

            <option value="All">📋 All Orders</option>

            <option value="New">🆕 New</option>

            <option value="Preparing">👨‍🍳 Preparing</option>

            <option value="Ready">✅ Ready</option>

            <option value="Completed">🎉 Completed</option>

        </select>


        <!-- ORDER LIST -->

        <div id="ordersList">

            <div class="empty">
                Loading orders...
            </div>

        </div>

    </div>

</div>


<script type="module">


    /* =========================
       FIREBASE IMPORTS
    ========================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey: "AIzaSyCuy68o-h0dcAVO7cg183xlQnBpttp2gAs",

        authDomain: "kayakani-bakery.firebaseapp.com",

        projectId: "kayakani-bakery",

        storageBucket: "kayakani-bakery.firebasestorage.app",

        messagingSenderId: "861879891216",

        appId: "1:861879891216:web:a9c91ee27859ef9ef62195"

    };



    /* =========================
       FIREBASE INITIALIZE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);



    /* =========================
       STORE ALL ORDERS
    ========================= */

    let allOrders = [];



    /* =========================
       CHECK LOGIN
    ========================= */

    onAuthStateChanged(auth, function(user) {

        if (!user) {

            window.location.href = "admin.html";

            return;

        }

        loadOrders();

    });



    /* =========================
       LOAD ORDERS
    ========================= */

    function loadOrders() {

        onSnapshot(
            collection(db, "orders"),
            function(snapshot) {

                const orders = [];


                snapshot.forEach(function(firebaseDoc) {

                    const order = firebaseDoc.data();

                    order.docId = firebaseDoc.id;

                    orders.push(order);

                });


                /* SORT NEWEST FIRST */

                orders.sort(function(a, b) {

                    const timeA =
                        a.createdAt
                            ? a.createdAt.toMillis()
                            : 0;

                    const timeB =
                        b.createdAt
                            ? b.createdAt.toMillis()
                            : 0;

                    return timeB - timeA;

                });


                /* IMPORTANT:
                   SAVE ALL ORDERS HERE */

                allOrders = orders;


                /* SHOW ALL ORDERS */

                displayOrders(orders);

            },
            function(error) {

                console.error("Loading error:", error);

                document.getElementById("ordersList").innerHTML =
                    '<div class="empty">Unable to load orders.</div>';

            }
        );

    }



    /* =========================
       DISPLAY ORDERS
    ========================= */

    function displayOrders(orders) {

        const ordersList =
            document.getElementById("ordersList");


        /* STATS */

        document.getElementById("orderCount").textContent =
            orders.length;


        let today =
            new Date().toDateString();

        let todayCount = 0;

        let totalSales = 0;


        orders.forEach(function(order) {


            /* TODAY'S ORDERS */

            if (order.createdAt) {

                const date =
                    order.createdAt.toDate();

                if (
                    date.toDateString() === today
                ) {

                    todayCount++;

                }

            }


            /* SALES */

            totalSales +=
                Number(order.grandTotal || 0);

        });


        document.getElementById("todayOrders").textContent =
            todayCount;


        document.getElementById("sales").textContent =
            "₹" + totalSales;



        /* NO MATCHING ORDERS */

        if (orders.length === 0) {

            ordersList.innerHTML =
                '<div class="empty">No matching orders found.</div>';

            return;

        }



        /* CLEAR OLD ORDERS */

        ordersList.innerHTML = "";



        /* DISPLAY EACH ORDER */

        orders.forEach(function(order) {


            let itemsHTML = "";


            /* ITEMS */

            (order.items || []).forEach(function(item) {

                itemsHTML += `
                    <div>
                        ${item.name} × ${item.quantity}
                        — ₹${Number(item.price) * Number(item.quantity)}
                    </div>
                `;

            });



            /* DATE */

            let dateText = "";


            if (order.createdAt) {

                dateText =
                    order.createdAt
                        .toDate()
                        .toLocaleString();

            }



            /* ORDER CARD */

            ordersList.innerHTML += `

                <div class="order">

                    <h3>
                        🧾 ${order.orderId || "Order"}
                    </h3>


                    <p>
                        <b>Customer:</b>
                        ${order.name || ""}
                    </p>


                    <p>
                        <b>Phone:</b>
                        ${order.phone || ""}
                    </p>


                    <p>
                        <b>Order Type:</b>
                        ${order.orderType || ""}
                    </p>


                    ${
                        order.address
                        ?
                        `<p>
                            <b>Address:</b>
                            ${order.address}
                        </p>`
                        :
                        ""
                    }


                    <p>
                        <b>Payment:</b>
                        ${order.payment || ""}
                    </p>


                    <hr>


                    <b>Items:</b>

                    ${itemsHTML}


                    <hr>


                    <p>
                        <b>Items Total:</b>
                        ₹${order.itemsTotal || 0}
                    </p>


                    <p>
                        <b>Delivery:</b>
                        ₹${order.deliveryCharge || 0}
                    </p>


                    <h3>
                        Grand Total:
                        ₹${order.grandTotal || 0}
                    </h3>



                    <!-- STATUS -->

                    <select
                        class="status"
                        onchange="updateOrderStatus('${order.docId}', this.value)"
                    >

                        <option value="New"
                            ${order.status === "New" ? "selected" : ""}>
                            New
                        </option>


                        <option value="Preparing"
                            ${order.status === "Preparing" ? "selected" : ""}>
                            Preparing
                        </option>


                        <option value="Ready"
                            ${order.status === "Ready" ? "selected" : ""}>
                            Ready
                        </option>


                        <option value="Completed"
                            ${order.status === "Completed" ? "selected" : ""}>
                            Completed
                        </option>

                    </select>



                    <!-- DELETE -->

                    <button
                        onclick="deleteOrder('${order.docId}')"
                        style="
                            margin-top:10px;
                            padding:8px 14px;
                            border:none;
                            border-radius:8px;
                            background:#c62828;
                            color:white;
                            cursor:pointer;
                        "
                    >
                        🗑️ Delete Order
                    </button>


                    <p>
                        <small>
                            ${dateText}
                        </small>
                    </p>

                </div>

            `;

        });

    }



    /* =========================
       SEARCH + STATUS FILTER
    ========================= */

    document
        .getElementById("searchOrders")
        .addEventListener("input", function() {

            filterOrders();

        });



    document
        .getElementById("statusFilter")
        .addEventListener("change", function() {

            filterOrders();

        });



    function filterOrders() {


        const searchText =
            document
                .getElementById("searchOrders")
                .value
                .toLowerCase()
                .trim();


        const selectedStatus =
            document
                .getElementById("statusFilter")
                .value;


        const filteredOrders =
            allOrders.filter(function(order) {


                const name =
                    String(order.name || "")
                        .toLowerCase();


                const phone =
                    String(order.phone || "")
                        .toLowerCase();


                const orderId =
                    String(order.orderId || "")
                        .toLowerCase();


                const orderStatus =
                    order.status || "New";


                /* SEARCH MATCH */

                const searchMatch =

                    name.includes(searchText) ||

                    phone.includes(searchText) ||

                    orderId.includes(searchText);



                /* STATUS MATCH */

                const statusMatch =

                    selectedStatus === "All" ||

                    orderStatus === selectedStatus;



                return searchMatch && statusMatch;

            });



        displayOrders(filteredOrders);

    }



    /* =========================
       UPDATE ORDER STATUS
    ========================= */

    window.updateOrderStatus =
        async function(orderId, newStatus) {

            try {

                console.log(
                    "Updating:",
                    orderId,
                    newStatus
                );


                const orderRef =
                    doc(db, "orders", orderId);


                await updateDoc(
                    orderRef,
                    {
                        status: newStatus
                    }
                );


                console.log(
                    "Status saved successfully"
                );


            }
            catch (error) {

                console.error(
                    "Firebase error:",
                    error
                );


                alert(
                    "Status could not be saved.\n\n" +
                    error.message
                );

            }

        };



    /* =========================
       DELETE ORDER
    ========================= */

    window.deleteOrder =
        async function(orderId) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this order?"
                );


            if (!confirmDelete) {

                return;

            }


            try {

                await deleteDoc(
                    doc(db, "orders", orderId)
                );


                alert(
                    "Order deleted successfully."
                );


            }
            catch (error) {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Failed to delete order.\n\n" +
                    error.message
                );

            }

        };



    /* =========================
       LOGOUT
    ========================= */

    window.logout =
        async function() {


            await signOut(auth);


            window.location.href =
                "admin.html";

        };


</script>

</body>
</html>
