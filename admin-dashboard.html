<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayakani Bakery - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf0;
            color: #173b20;
        }

        header {
            background: #173b20;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            background: white;
            color: #173b20;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
            text-align: center;
        }

        .stat h3 {
            margin: 0;
            font-size: 32px;
            color: #638d32;
        }

        .stat p {
            margin-bottom: 0;
            color: #777;
        }

        .orders {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .order h3 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 12px;
            border-radius: 15px;
            background: #e7efd9;
            color: #173b20;
            font-weight: bold;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 30px;
        }

        .print-button {
            margin-top: 10px;
            margin-right: 5px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #638d32;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .print-button:hover {
            opacity: 0.9;
        }

        .delete-button {
            margin-top: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #c62828;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-button:hover {
            opacity: 0.9;
        }

        @media(max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }

            .orders {
                padding: 15px;
            }
        }
    </style>
</head>


<body>


<header>

    <h2>🍰 Kayakani Admin</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">


    <div class="welcome">

        <h1>Admin Dashboard</h1>

        <p>Manage your bakery orders from here.</p>

    </div>


    <!-- STATS -->

    <div class="stats">


        <div class="stat">

            <h3 id="orderCount">0</h3>

            <p>Total Orders</p>

        </div>


        <div class="stat">

            <h3 id="todayOrders">0</h3>

            <p>Today's Orders</p>

        </div>


        <div class="stat">

            <h3 id="sales">₹0</h3>

            <p>Total Sales</p>

        </div>


    </div>



    <!-- ORDERS -->

    <div class="orders">


        <h2>📦 Customer Orders</h2>


        <!-- SEARCH -->

        <input
            type="text"
            id="searchOrders"
            placeholder="🔍 Search by name, phone or order ID..."
            style="width:100%; padding:12px; margin:15px 0; border:1px solid #ddd; border-radius:10px; font-size:16px;"
        >


        <!-- STATUS FILTER -->

        <select
            id="statusFilter"
            style="width:100%; padding:12px; margin:5px 0 15px 0; border:1px solid #ddd; border-radius:10px; font-size:16px;"
        >

            <option value="All">📋 All Orders</option>

            <option value="New">🆕 New</option>

            <option value="Preparing">👨‍🍳 Preparing</option>

            <option value="Ready">✅ Ready</option>

            <option value="Completed">🎉 Completed</option>

        </select>



        <!-- ORDER LIST -->

        <div id="ordersList">

            <div class="empty">
                Loading orders...
            </div>

        </div>


    </div>


</div>

 <audio id="notificationSound" src="notification.mp3" preload="auto"></audio>

<script type="module">  

   


    /* =========================
       FIREBASE IMPORTS
    ========================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        collection,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey: "AIzaSyCuy68o-h0dcAVO7cg183xlQnBpttp2gAs",

        authDomain: "kayakani-bakery.firebaseapp.com",

        projectId: "kayakani-bakery",

        storageBucket: "kayakani-bakery.firebasestorage.app",

        messagingSenderId: "861879891216",

        appId: "1:861879891216:web:a9c91ee27859ef9ef62195"

    };



    /* =========================
       FIREBASE INITIALIZE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);



    /* =========================
       ALL ORDERS
    ========================= */

    let allOrders = [];



    /* =========================
       CHECK LOGIN
    ========================= */

    onAuthStateChanged(auth, function(user) {

        if (!user) {

            window.location.href = "admin.html";

            return;

        }

        loadOrders();

    });



    /* =========================
       LOAD ORDERS
    ========================= */

function loadOrders() {

    let firstLoad = true;

    onSnapshot(
        collection(db, "orders"),

        function(snapshot) {

            const orders = [];

            if (!firstLoad && snapshot.docChanges().some(function(change) {
                return change.type === "added";
            })) {
                const sound = document.getElementById("notificationSound");

                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(function(error) {
                        console.log("Notification sound blocked:", error);
                    });
                }

                alert("🔔 New Order Received!");
            }

            firstLoad = false;


                snapshot.forEach(function(firebaseDoc) {

                    const order = firebaseDoc.data();

                    order.docId = firebaseDoc.id;

                    orders.push(order);

                });


                /* SORT NEWEST FIRST */

                orders.sort(function(a, b) {

                    const timeA =
                        a.createdAt
                            ? a.createdAt.toMillis()
                            : 0;

                    const timeB =
                        b.createdAt
                            ? b.createdAt.toMillis()
                            : 0;

                    return timeB - timeA;

                });


                /* SAVE ALL ORDERS */

                allOrders = orders;


                /* DISPLAY ALL */

                filterOrders();

            },

            function(error) {

                console.error(
                    "Loading error:",
                    error
                );

                document.getElementById(
                    "ordersList"
                ).innerHTML =
                    '<div class="empty">Unable to load orders.</div>';

            }
        );

    }



    /* =========================
       DISPLAY ORDERS
    ========================= */

    function displayOrders(orders) {


        const ordersList =
            document.getElementById(
                "ordersList"
            );


        /* STATS */

        document.getElementById(
            "orderCount"
        ).textContent = orders.length;


        let today =
            new Date().toDateString();


        let todayCount = 0;

        let totalSales = 0;


        orders.forEach(function(order) {


            if (order.createdAt) {

                const date =
                    order.createdAt.toDate();


                if (
                    date.toDateString() === today
                ) {

                    todayCount++;

                }

            }


            totalSales +=
                Number(
                    order.grandTotal || 0
                );

        });


        document.getElementById(
            "todayOrders"
        ).textContent =
            todayCount;


        document.getElementById(
            "sales"
        ).textContent =
            "₹" + totalSales;



        /* NO ORDERS */

        if (orders.length === 0) {

            ordersList.innerHTML =
                '<div class="empty">No matching orders found.</div>';

            return;

        }


        ordersList.innerHTML = "";



        /* DISPLAY ORDERS */

        orders.forEach(function(order) {


            let itemsHTML = "";


            (order.items || []).forEach(
                function(item) {

                    itemsHTML += `

                        <div>
                            ${item.name} × ${item.quantity}
                            — ₹${Number(item.price) * Number(item.quantity)}
                        </div>

                    `;

                }
            );



            /* DATE */

            let dateText = "";


            if (order.createdAt) {

                dateText =
                    order.createdAt
                        .toDate()
                        .toLocaleString();

            }



            /* ORDER CARD */

            ordersList.innerHTML += `

                <div class="order">


                    <h3>
                        🧾 ${order.orderId || "Order"}
                    </h3>


                    <p>
                        <b>Customer:</b>
                        ${order.name || ""}
                    </p>


                    <p>
                        <b>Phone:</b>
                        ${order.phone || ""}
                    </p>


                    <p>
                        <b>Order Type:</b>
                        ${order.orderType || ""}
                    </p>


                    ${
                        order.address
                        ?
                        `<p>
                            <b>Address:</b>
                            ${order.address}
                        </p>`
                        :
                        ""
                    }


                    <p>
                        <b>Payment:</b>
                        ${order.payment || ""}
                    </p>


                    <hr>


                    <b>Items:</b>

                    ${itemsHTML}


                    <hr>


                    <p>
                        <b>Items Total:</b>
                        ₹${order.itemsTotal || 0}
                    </p>


                    <p>
                        <b>Delivery:</b>
                        ₹${order.deliveryCharge || 0}
                    </p>


                    <h3>
                        Grand Total:
                        ₹${order.grandTotal || 0}
                    </h3>



                    <!-- STATUS -->

                    <select
                        class="status"
                        onchange="updateOrderStatus('${order.docId}', this.value)"
                    >

                        <option value="New"
                            ${order.status === "New" ? "selected" : ""}>
                            New
                        </option>


                        <option value="Preparing"
                            ${order.status === "Preparing" ? "selected" : ""}>
                            Preparing
                        </option>


                        <option value="Ready"
                            ${order.status === "Ready" ? "selected" : ""}>
                            Ready
                        </option>


                        <option value="Completed"
                            ${order.status === "Completed" ? "selected" : ""}>
                            Completed
                        </option>

                    </select>



                    <!-- PRINT BUTTON -->

                    <button
                        class="print-button"
                        onclick="printOrder('${order.docId}')"
                    >
                        🖨️ Print Order
                    </button>



                    <!-- DELETE BUTTON -->

                    <button
                        class="delete-button"
                        onclick="deleteOrder('${order.docId}')"
                    >
                        🗑️ Delete Order
                    </button>


                    <p>
                        <small>
                            ${dateText}
                        </small>
                    </p>


                </div>

            `;

        });

    }



    /* =========================
       SEARCH + STATUS FILTER
    ========================= */

    document
        .getElementById("searchOrders")
        .addEventListener(
            "input",
            function() {

                filterOrders();

            }
        );


    document
        .getElementById("statusFilter")
        .addEventListener(
            "change",
            function() {

                filterOrders();

            }
        );



    function filterOrders() {


        const searchText =
            document
                .getElementById(
                    "searchOrders"
                )
                .value
                .toLowerCase()
                .trim();


        const selectedStatus =
            document
                .getElementById(
                    "statusFilter"
                )
                .value;


        const filteredOrders =
            allOrders.filter(
                function(order) {


                    const name =
                        String(
                            order.name || ""
                        ).toLowerCase();


                    const phone =
                        String(
                            order.phone || ""
                        ).toLowerCase();


                    const orderId =
                        String(
                            order.orderId || ""
                        ).toLowerCase();


                    const orderStatus =
                        order.status || "New";


                    const searchMatch =

                        name.includes(
                            searchText
                        )

                        ||

                        phone.includes(
                            searchText
                        )

                        ||

                        orderId.includes(
                            searchText
                        );


                    const statusMatch =

                        selectedStatus === "All"

                        ||

                        orderStatus ===
                            selectedStatus;


                    return (
                        searchMatch &&
                        statusMatch
                    );

                }
            );


        displayOrders(
            filteredOrders
        );

    }



    /* =========================
       PRINT ORDER
    ========================= */

    window.printOrder =
        function(orderId) {


            const order =
                allOrders.find(
                    function(item) {

                        return item.docId === orderId;

                    }
                );


            if (!order) {

                alert("Order not found.");

                return;

            }



            let itemsHTML = "";


            (order.items || []).forEach(
                function(item) {

                    itemsHTML += `

                        <tr>

                            <td>
                                ${item.name}
                            </td>

                            <td>
                                ${item.quantity}
                            </td>

                            <td>
                                ₹${item.price}
                            </td>

                            <td>
                                ₹${Number(item.price) * Number(item.quantity)}
                            </td>

                        </tr>

                    `;

                }
            );



            let dateText = "";


            if (order.createdAt) {

                dateText =
                    order.createdAt
                        .toDate()
                        .toLocaleString();

            }



            const printWindow =
                window.open(
                    "",
                    "_blank",
                    "width=800,height=700"
                );


            printWindow.document.write(`

                <!DOCTYPE html>

                <html>

                <head>

                    <title>
                        ${order.orderId || "Order"}
                    </title>

                    <style>

                        body {

                            font-family: Arial, sans-serif;

                            padding: 30px;

                            color: #222;

                        }


                        .receipt {

                            max-width: 700px;

                            margin: auto;

                        }


                        h1 {

                            text-align: center;

                            margin-bottom: 5px;

                        }


                        .shop {

                            text-align: center;

                            color: #555;

                            margin-bottom: 25px;

                        }


                        hr {

                            border: none;

                            border-top: 1px solid #ccc;

                            margin: 15px 0;

                        }


                        table {

                            width: 100%;

                            border-collapse: collapse;

                            margin-top: 15px;

                        }


                        th,
                        td {

                            border: 1px solid #ddd;

                            padding: 8px;

                            text-align: left;

                        }


                        th {

                            background: #f5f5f5;

                        }


                        .total {

                            text-align: right;

                            font-size: 18px;

                            font-weight: bold;

                        }


                        .center {

                            text-align: center;

                        }

                    </style>

                </head>


                <body>

                    <div class="receipt">


                        <h1>
                            🍰 Kayakani Bakery & Sweets
                        </h1>


                        <div class="shop">

                            Dindigul Bus Stand,
                            Spencer Complex,
                            32, Dindigul, Tamil Nadu

                        </div>


                        <hr>


                        <p>
                            <b>Order ID:</b>
                            ${order.orderId || ""}
                        </p>


                        <p>
                            <b>Date:</b>
                            ${dateText}
                        </p>


                        <p>
                            <b>Customer:</b>
                            ${order.name || ""}
                        </p>


                        <p>
                            <b>Phone:</b>
                            ${order.phone || ""}
                        </p>


                        <p>
                            <b>Order Type:</b>
                            ${order.orderType || ""}
                        </p>


                        ${
                            order.address
                            ?
                            `<p>
                                <b>Address:</b>
                                ${order.address}
                            </p>`
                            :
                            ""
                        }


                        <p>
                            <b>Payment:</b>
                            ${order.payment || ""}
                        </p>


                        <hr>


                        <table>

                            <tr>

                                <th>
                                    Item
                                </th>

                                <th>
                                    Qty
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Total
                                </th>

                            </tr>


                            ${itemsHTML}

                        </table>


                        <hr>


                        <p>
                            <b>Items Total:</b>
                            ₹${order.itemsTotal || 0}
                        </p>


                        <p>
                            <b>Delivery:</b>
                            ₹${order.deliveryCharge || 0}
                        </p>


                        <p class="total">

                            Grand Total:
                            ₹${order.grandTotal || 0}

                        </p>


                        <hr>


                        <p class="center">

                            Thank you for ordering! ❤️

                        </p>


                    </div>

                </body>

                </html>

            `);


            printWindow.document.close();


            printWindow.focus();


            setTimeout(
                function() {

                    printWindow.print();

                },
                500
            );

        };



    /* =========================
       UPDATE ORDER STATUS
    ========================= */

    window.updateOrderStatus =
        async function(
            orderId,
            newStatus
        ) {


            try {


                const orderRef =
                    doc(
                        db,
                        "orders",
                        orderId
                    );


                await updateDoc(
                    orderRef,
                    {
                        status: newStatus
                    }
                );


                console.log(
                    "Status saved successfully"
                );


            }
            catch (error) {


                console.error(
                    "Firebase error:",
                    error
                );


                alert(
                    "Status could not be saved.\n\n" +
                    error.message
                );

            }

        };



    /* =========================
       DELETE ORDER
    ========================= */

    window.deleteOrder =
        async function(orderId) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this order?"
                );


            if (!confirmDelete) {

                return;

            }


            try {


                await deleteDoc(
                    doc(
                        db,
                        "orders",
                        orderId
                    )
                );


                alert(
                    "Order deleted successfully."
                );


            }
            catch (error) {


                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Failed to delete order.\n\n" +
                    error.message
                );

            }

        };



    /* =========================
       LOGOUT
    ========================= */

    window.logout =
        async function() {


            await signOut(auth);


            window.location.href =
                "admin.html";

        };


</script>


</body>

</html>
