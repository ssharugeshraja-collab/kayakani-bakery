<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayakani Bakery - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fffaf0;
            color: #173b20;
        }

        header {
            background: #173b20;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            background: white;
            color: #173b20;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
            text-align: center;
        }

        .stat h3 {
            margin: 0;
            font-size: 32px;
            color: #638d32;
        }

        .stat p {
            margin-bottom: 0;
            color: #777;
        }

        .orders {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }

        .order {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .order h3 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 7px 12px;
            border-radius: 15px;
            background: #e7efd9;
            color: #173b20;
            font-weight: bold;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 30px;
        }

        @media(max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <h2>🍰 Kayakani Admin</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h1>Admin Dashboard</h1>

        <p>Manage your bakery orders from here.</p>

    </div>


    <div class="stats">

        <div class="stat">

            <h3 id="orderCount">0</h3>

            <p>Total Orders</p>

        </div>


        <div class="stat">

            <h3 id="todayOrders">0</h3>

            <p>Today's Orders</p>

        </div>


        <div class="stat">

            <h3 id="sales">₹0</h3>

            <p>Total Sales</p>

        </div>

    </div>


    <div class="orders">

        <h2>📦 Customer Orders</h2>

        <div id="ordersList">

            <div class="empty">
                No orders yet.
            </div>

        </div>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    onSnapshot,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    
    const firebaseConfig = {

        apiKey: "AIzaSyCuy68o-h0dcAVO7cg183xlQnBpttp2gAs",

        authDomain: "kayakani-bakery.firebaseapp.com",

        projectId: "kayakani-bakery",

        storageBucket: "kayakani-bakery.firebasestorage.app",

        messagingSenderId: "861879891216",

        appId: "1:861879891216:web:a9c91ee27859ef9ef62195"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


onAuthStateChanged(auth, function(user) {
    if (!user) {
        window.location.href = "admin.html";
        return;
    }

    loadOrders();
});

function loadOrders() {
    onSnapshot(collection(db, "orders"), function(snapshot) {

        const orders = [];

        snapshot.forEach(function(doc) {
            orders.push(doc.data());
        });

        orders.sort(function(a, b) {
            const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
            const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
            return timeB - timeA;
        });

        displayOrders(orders);
    });
}

    function displayOrders(orders) {

    const ordersList = document.getElementById("ordersList");

    document.getElementById("orderCount").textContent = orders.length;

    let today = new Date().toDateString();
    let todayCount = 0;
    let totalSales = 0;

    orders.forEach(function(order) {

        if (order.createdAt) {
            const date = order.createdAt.toDate();

            if (date.toDateString() === today) {
                todayCount++;
            }
        }

        totalSales += Number(order.grandTotal || 0);
    });

    document.getElementById("todayOrders").textContent = todayCount;
    document.getElementById("sales").textContent = totalSales;

    if (orders.length === 0) {
        ordersList.innerHTML =
            '<div class="empty">No orders yet.</div>';
        return;
    }

    ordersList.innerHTML = "";

    orders.forEach(function(order) {

        let itemsHTML = "";

        (order.items || []).forEach(function(item) {
            itemsHTML += `
                <div>
                    ${item.name} × ${item.quantity}
                    — ₹${item.price * item.quantity}
                </div>
            `;
        });

        let dateText = "";

        if (order.createdAt) {
            dateText = order.createdAt.toDate().toLocaleString();
        }

        ordersList.innerHTML += `
            <div class="order">

                <h3>🧾 ${order.orderId || "Order"}</h3>

                <p><b>Customer:</b> ${order.name}</p>
                <p><b>Phone:</b> ${order.phone}</p>
                <p><b>Order Type:</b> ${order.orderType}</p>

                ${
                    order.address
                    ? `<p><b>Address:</b> ${order.address}</p>`
                    : ""
                }

                <p><b>Payment:</b> ${order.payment}</p>

                <hr>

                <b>Items:</b>
                ${itemsHTML}

                <hr>

                <p><b>Items Total:</b> ₹${order.itemsTotal}</p>
                <p><b>Delivery:</b> ₹${order.deliveryCharge}</p>
                <h3>Grand Total: ₹${order.grandTotal}</h3>

               <select class="status">
                     <option ${order.status === "New" ? "selected" : ""}>New</option>
                     <option ${order.status === "Preparing" ? "selected" : ""}>Preparing</option>
                     <option ${order.status === "Ready" ? "selected" : ""}>Ready</option>
                     <option ${order.status === "Completed" ? "selected" : ""}>Completed</option>
               </select>

                <p><small>${dateText}</small></p>

            </div>
        `;
    });
}

async function updateOrderStatus(orderId, newStatus) {

    try {

        await updateDoc(doc(db, "orders", orderId), {
            status: newStatus
        });

        console.log("Status updated successfully");

    } catch (error) {

        console.error("Error updating status:", error);
        alert("Failed to update order status.");

    }
}
    
    window.logout = async function() {

        await signOut(auth);

        window.location.href = "admin.html";

    };

</script>

</body>
</html>
